services:
  - type: web
    name: dataprism
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATAPRISM_HOST
        value: 0.0.0.0
      - key: DATAPRISM_DB
        value: /var/data/platform.sqlite3
    disk:
      name: dataprism-data
      mountPath: /var/data
      sizeGB: 1
